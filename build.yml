name: Build NetScanGUI.exe

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build EXE
        run: pyinstaller --clean --noconfirm NetScanGUI.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetScanGUI-windows
          path: dist/NetScanGUI.exe
          retention-days: 30